<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Umrah Companion — UX walkthrough &amp; audio redesign</title>
<style>
:root{
  --gold:#D4AD54; --teal:#0F5451; --deep:#082B29; --ink:#0a0f0f;
  --panel:rgba(255,255,255,.055); --line:rgba(255,255,255,.13);
  --txt:#EDF2F1; --dim:#93A5A3; --grn:#4CB963; --red:#E5484D; --blu:#3B82F6; --org:#E8912D;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 800px at 78% -10%,#123f3d 0%,var(--deep) 55%,#050e0d 100%);
  color:var(--txt); font-family:var(--sans); -webkit-font-smoothing:antialiased;
}
/* ---------- deck chrome ---------- */
#deck{height:100vh;overflow:hidden;position:relative}
.slide{
  position:absolute;inset:0;padding:44px 56px 76px;overflow-y:auto;
  opacity:0;pointer-events:none;transform:translateY(14px);
  transition:opacity .34s ease,transform .34s ease;
}
.slide.on{opacity:1;pointer-events:auto;transform:none}
h1{font-size:44px;line-height:1.08;margin:0 0 14px;letter-spacing:-.02em;font-weight:800}
h2{font-size:30px;line-height:1.14;margin:0 0 6px;letter-spacing:-.015em;font-weight:750}
h3{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.11em;color:var(--gold);font-weight:700}
p{line-height:1.62;margin:0 0 12px;max-width:74ch;color:#DCE6E4}
.lede{font-size:19px;color:#C6D4D2;max-width:80ch}
.dim{color:var(--dim)}
small{color:var(--dim);font-size:13px;line-height:1.55}
code{font-family:var(--mono);font-size:.88em;background:rgba(255,255,255,.08);
  padding:2px 6px;border-radius:5px;color:#F0D9A6;white-space:nowrap}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.rule{height:1px;background:var(--line);margin:22px 0}
/* nav */
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;
  gap:14px;padding:0 22px;background:rgba(4,12,11,.82);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);z-index:60}
#bar button{background:var(--panel);color:var(--txt);border:1px solid var(--line);
  border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
#bar button:hover{background:rgba(255,255,255,.11);border-color:rgba(212,173,84,.5)}
#dots{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;max-width:52%;justify-content:flex-end}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;flex:none}
.dot.on{background:var(--gold);transform:scale(1.35)}
#pos{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:56px}
/* layout */
.grid{display:grid;gap:26px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.split{display:grid;grid-template-columns:minmax(288px,306px) 1fr;gap:38px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h4{margin:0 0 8px;font-size:16px;color:var(--gold)}
.card p{font-size:14.5px;margin:0;color:#CFDBD9}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  padding:3px 8px;border-radius:20px;border:1px solid;margin:0 5px 5px 0;white-space:nowrap}
.t-done{color:var(--grn);border-color:rgba(76,185,99,.45);background:rgba(76,185,99,.1)}
.t-gap{color:var(--red);border-color:rgba(229,72,77,.45);background:rgba(229,72,77,.1)}
.t-new{color:var(--gold);border-color:rgba(212,173,84,.45);background:rgba(212,173,84,.1)}
.t-neu{color:var(--dim);border-color:var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--gold);font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
td.ic{width:44px}
tr:hover td{background:rgba(255,255,255,.028)}
ul{margin:0 0 12px;padding-left:20px;line-height:1.66;color:#DCE6E4}
li{margin-bottom:7px}
li::marker{color:var(--gold)}
.note{border-left:3px solid var(--gold);padding:10px 0 10px 16px;margin:16px 0;
  background:linear-gradient(90deg,rgba(212,173,84,.09),transparent 70%);border-radius:0 8px 8px 0}
.note p{margin:0;font-size:14.5px}
.warn{border-left-color:var(--red);background:linear-gradient(90deg,rgba(229,72,77,.1),transparent 70%)}
/* ---------- phone ---------- */
.phone{width:288px;height:600px;border-radius:40px;padding:9px;flex:none;
  background:linear-gradient(160deg,#3a3f3e,#141918 60%);
  box-shadow:0 34px 80px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.09);position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;
  background:#0c1413;display:flex;flex-direction:column;isolation:isolate}
.cam{position:absolute;inset:0;
  background:
    radial-gradient(60% 42% at 50% 74%,rgba(150,120,70,.36),transparent 70%),
    linear-gradient(#1d2725 0%,#141d1c 42%,#28221a 42.5%,#3a2f22 100%);}
.cam.mesh{background:
    repeating-linear-gradient(58deg,rgba(90,255,220,.30) 0 1px,transparent 1px 17px),
    repeating-linear-gradient(-58deg,rgba(90,255,220,.30) 0 1px,transparent 1px 17px),
    linear-gradient(#111a19,#221d16);}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:84px;height:20px;
  background:#000;border-radius:14px;z-index:9}
.ui{position:relative;z-index:5;display:flex;flex-direction:column;height:100%;padding:11px;gap:7px}
.ui.rtl{direction:rtl}
.ink{background:rgba(0,0,0,.55);border-radius:15px}
.topbar{display:flex;align-items:center;gap:5px;margin-top:20px}
.langpill{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);
  border-radius:99px;padding:5px 9px;font-size:10.8px;font-weight:650;color:#fff;cursor:pointer}
.tb{width:29px;height:29px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;
  place-items:center;cursor:pointer;flex:none;transition:transform .12s}
.tb:hover{transform:scale(1.09)}
.tb svg{width:17px;height:17px}
.tb.off svg{fill:rgba(255,255,255,.7);stroke:rgba(255,255,255,.7)}
.tb.on svg{fill:var(--gold);stroke:var(--gold)}
.tb.red svg{fill:var(--red);stroke:var(--red)}
.banner{display:flex;align-items:center;gap:8px;padding:10px;font-size:12px;font-weight:650;line-height:1.32}
.led{width:9px;height:9px;border-radius:50%;flex:none}
.gbanner{display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:11.5px;font-weight:700}
.det{padding:7px 9px;display:flex;flex-direction:column;gap:4px;font-size:10.8px}
.detrow{display:flex;align-items:center;gap:7px}
.detrow .d{margin-left:auto;color:var(--gold);font-family:var(--mono)}
.ui.rtl .detrow .d{margin-left:0;margin-right:auto}
.ring{width:146px;height:146px;margin:2px auto;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt b{display:block;font-size:44px;font-weight:800;line-height:1;
  font-family:ui-rounded,var(--sans)}
.ringtxt span{font-size:11.5px;color:rgba(255,255,255,.85)}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:6px;background:rgba(229,72,77,.85);
  border-radius:99px;padding:7px 11px;font-size:10.8px;font-weight:700;justify-content:center}
.btnrow{display:flex;gap:9px}
.big{flex:1;height:46px;border-radius:11px;border:none;font:inherit;font-size:13px;
  font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;color:#0d0d0d}
.big.gold{background:var(--gold)}
.big.green{background:var(--grn)}
.big.blue{background:var(--blu);color:#fff}
.big svg{width:16px;height:16px}
.reset{height:34px;border-radius:9px;background:transparent;border:1px solid rgba(255,255,255,.55);
  color:#fff;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;
  align-items:center;justify-content:center;gap:6px}
.launch{position:absolute;inset:0;z-index:20;display:grid;place-content:center;text-align:center;
  background:linear-gradient(160deg,var(--teal),var(--deep));gap:10px}
/* callouts */
.callout{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;line-height:1.5;
  padding:9px 0;border-bottom:1px dashed var(--line)}
.callout b{color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  border:1px solid rgba(212,173,84,.4);border-radius:4px;padding:2px 6px;flex:none;margin-top:1px}
/* state chips row */
.states{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
.sbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;
  padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.sbtn.on{border-color:var(--gold);background:rgba(212,173,84,.16);color:var(--gold)}
/* audio timeline */
.tl{position:relative;height:74px;border:1px solid var(--line);border-radius:10px;
  background:rgba(0,0,0,.28);margin:10px 0 4px;overflow:hidden}
.tl .lab{position:absolute;left:9px;top:7px;font-family:var(--mono);font-size:10.5px;
  color:var(--dim);letter-spacing:.05em;z-index:3}
.ev{position:absolute;bottom:8px;border-radius:3px;height:26px}
.ev.sp{background:rgba(229,72,77,.85)}
.ev.ec{background:rgba(212,173,84,.9);height:13px}
.ev.hp{background:rgba(59,130,246,.9);height:9px}
.tone{position:absolute;left:0;right:0;bottom:38px;height:12px;
  background:repeating-linear-gradient(90deg,rgba(212,173,84,.75) 0 3px,transparent 3px 12px)}
.tl small{position:absolute;right:9px;top:7px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* audio demo */
.audiobox{border:1px solid rgba(212,173,84,.35);border-radius:14px;padding:16px 18px;
  background:linear-gradient(160deg,rgba(212,173,84,.09),transparent)}
.playrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.play{background:var(--gold);color:#111;border:none;border-radius:10px;padding:10px 16px;
  font:inherit;font-weight:750;font-size:13.5px;cursor:pointer}
.play.ghost{background:transparent;color:var(--gold);border:1px solid rgba(212,173,84,.55)}
.play:disabled{opacity:.45;cursor:default}
#lognow{font-family:var(--mono);font-size:12px;color:var(--gold);min-height:18px;margin-top:9px}
.big-num{font-size:52px;font-weight:800;color:var(--gold);line-height:1;letter-spacing:-.03em}
.metric{text-align:center;padding:16px 10px}
.metric small{display:block;margin-top:7px;font-size:12.5px}
.arrow{display:grid;place-content:center;font-size:26px;color:var(--gold)}
@media (max-width:1080px){
  .split{grid-template-columns:1fr;gap:26px}.g2,.g3{grid-template-columns:1fr}
  h1{font-size:33px}h2{font-size:24px}.slide{padding:28px 22px 74px}
}
</style>
</head>
<body>
<div id="deck"></div>
<div id="bar">
  <button onclick="go(-1)">← Prev</button>
  <button onclick="go(1)">Next →</button>
  <span id="pos"></span>
  <span class="dim" style="font-size:12px">← → arrows · click a dot</span>
  <div id="dots"></div>
</div>

function newState(o={}){return Object.assign({
  phase:'idle', ritual:'tawaf', count:0, progress:0, trackingOK:true,
  guidanceOn:false, guidanceState:'onPath', steerLeft:true,
  muted:false, dua:0, debug:false, lang:'en',
  speaking:false, listening:false, showDet:true, showChip:false, launch:false
},o);}

/* Faithful to DemoView.swift: statusLine comes from refreshStatus() */
function statusLine(s){const t=L[s.lang];
  if(s.phase==='idle')return t.choose;
  if(s.phase==='marking')return s.ritual==='tawaf'?t.markPrompt:t.markSafa;
  if(s.phase==='markingSecond')return t.markMarwah;
  if(s.phase==='tawaf'||s.phase==='sai')return t.begin;
  return s.ritual==='tawaf'?t.tawafDone:t.saiDone;}

function phoneHTML(s,id){

       <div class="tb ${s.muted?'red':'off'}" data-act="mute" data-id="${id}" title="Mute obstacle warnings">
         ${I[s.muted?'speaker.slash.fill':'speaker.wave.2.fill']}</div>

       <div class="tb ${s.debug?'on':'off'}" data-act="debug" data-id="${id}" title="LiDAR debug view">
         ${I[s.debug?'cube.transparent.fill':'cube.transparent']}</div>
     </div>
     <div class="ink banner"><span class="led" style="background:${s.trackingOK?'#4CB963':'#E8912D'}"></span>
       <span>${statusLine(s)}</span></div>
     ${showG?`<div class="ink gbanner">
       <span style="color:${s.guidanceState==='onPath'?'#4CB963':gold};display:inline-flex;width:16px">
         ${I[s.guidanceState==='onPath'?'checkmark.circle.fill':'arrow.triangle.turn.up.right.circle.fill']}</span>
       <span>${t.g[s.guidanceState]}</span></div>`:''}
     ${(s.showDet&&walking)?`<div class="ink det">${t.det.slice(0,3).map(d=>
       `<div class="detrow"><span style="color:${gold};display:inline-flex;width:13px">${I.viewfinder}</span>
        <span>${d[0]}</span><span class="d">${d[1]} m</span></div>`).join('')}</div>`:''}
     <div class="spacer"></div>
     ${showRing?`<div class="ring"><svg width="146" height="146" viewBox="0 0 146 146">
        <circle cx="73" cy="73" r="66" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="11"/>
        <circle cx="73" cy="73" r="66" fill="none" stroke="${gold}" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg>
        <div class="ringtxt"><b>${s.lang==='ar'?'٠١٢٣٤٥٦٧'[s.count]:s.count}</b>
        <span>${s.ritual==='tawaf'?t.of7c:t.of7l}</span></div></div>`:''}
     <div class="spacer"></div>

       `<button class="reset" data-act="reset" data-id="${id}">${ic('arrow.counterclockwise')} ${t.reset}</button>`:''}
   </div>

     <div style="font-family:serif;font-size:21px;color:#fff">${t.tawaf}</div>

}
function bigButtons(s,id){const t=L[s.lang];
  switch(s.phase){
   case 'idle': return `<button class="big gold" data-act="pickTawaf" data-id="${id}">${ic('circle.circle')}${t.tawaf}</button>
     <button class="big green" data-act="pickSai" data-id="${id}">${ic('arrow.left.arrow.right')}${t.sai}</button>`;

     return `<button class="big gold" data-act="mark" data-id="${id}">${ic('scope')}${s.ritual==='tawaf'?t.mark:t.markHere}</button>`;

     return `<button class="big blue" data-act="voice" data-id="${id}">${ic('mic.fill')}${s.listening?t.listening:t.voice}</button>`;

}

  <div class="card metric"><div class="big-num">~105s</div><small>of speech <b>demanded</b> per 60 s of
  walking, worst case (20 × 2.7 s + 15 × 3.4 s at the default speech rate)</small></div>

slides.push(`
<h2>The root cause is not the cue count. It's the queue.</h2>
<p class="lede">"Too many instructions" is the symptom. The mechanism is in
<code>SpeechService.speak</code>, which has <b>no queue management of any kind</b>.</p>
<div class="grid g2" style="margin-top:8px">
<div>
<h3>What the code does today</h3>
<div class="card" style="font-family:var(--mono);font-size:12.5px;line-height:1.7;background:rgba(0,0,0,.35)">
func speak(_ text: String,<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; interrupting: Bool = true) {<br>
&nbsp;&nbsp;if interrupting, synth.isSpeaking {<br>
&nbsp;&nbsp;&nbsp;&nbsp;synth.stopSpeaking(at: .immediate)<br>
&nbsp;&nbsp;}<br>
&nbsp;&nbsp;...<br>
&nbsp;&nbsp;<span style="color:#E5484D">synth.speak(u)</span>&nbsp;&nbsp;<span style="color:#93A5A3">// unbounded FIFO</span><br>
}
</div>
<p style="margin-top:14px">Two behaviours, both wrong for this use case:</p>
<ul>
<li><code>interrupting: true</code> — <b>truncates</b> whatever is mid-sentence. Used for command
confirmations, so a confirmation can cut a safety warning in half.</li>
<li><code>interrupting: false</code> — <b>appends to an unbounded FIFO</b>. Used for every guidance
cue, obstacle warning, circuit announcement and du'a.</li>
</ul>
<div class="note warn"><p>Nothing is ever <b>dropped</b>. At 175% oversubscription the queue only
grows, and every utterance plays back-to-back with no gap. The user hears one unbroken monologue,
and each correction describes a situation that is already several seconds stale.</p></div>
</div>
<div>
<h3>The four compounding faults</h3>
<div class="card" style="margin-bottom:12px"><h4>1 · Independent cooldowns, one channel</h4>
<p>The 3 s guidance timer and the 4 s obstacle timer never consult each other. Two well-behaved
limiters feeding one pipe produce an effective spacing of ~1.5 s.</p></div>
<div class="card" style="margin-bottom:12px"><h4>2 · Sentences where a word would do</h4>
<p>"You're drifting toward the Kaaba. Ease outward." is 8 words and 2.7 seconds. The actionable
content is one word: <b>outward</b>. Blind-navigation practice is 1–2 words, or a tone.</p></div>
<div class="card" style="margin-bottom:12px"><h4>3 · Correctness is not silent</h4>
<p>Walking perfectly still produces 3.2 ticks per second plus a lock tone. Sound therefore carries no
information — it is always on, so the user learns to tune it out, including the warnings.</p></div>
<div class="card"><h4>4 · No haptic channel at all</h4>
<p>Zero haptic calls in the codebase. Every scrap of urgency has to be expressed in audio, which is
why speech ended up carrying safety.</p></div>
</div>
</div>`);

/* ---------- 10. the redesign ---------- */
slides.push(`
<div class="kicker">Part 3 — the redesign</div>
<h2>Silence is the default state</h2>
<p class="lede">Eight changes. The first three do most of the work; the rest stop the problem
recurring as features are added.</p>
<div class="grid g2" style="margin-top:16px">
<div>
<div class="card" style="margin-bottom:12px"><h4>1 · <code>CueBus</code> — one arbiter</h4>
<p>Every call to <code>speech.speak</code> is replaced by <code>cues.post(_:priority:)</code>.
Five priorities: <b>safety → ritual → correction → du'a → chrome</b>. One slot, <b>no queue</b>. A
higher priority pre-empts; equal or lower is <b>dropped</b>, not deferred. A stale cue is worse than
no cue.</p></div>
<div class="card" style="margin-bottom:12px"><h4>2 · A global silence floor</h4>
<p>A single <code>minSilence = 2.0 s</code> gap between <i>any</i> two utterances, enforced in one
place. This alone caps speech at ~30% duty cycle instead of 175%.</p></div>
<div class="card" style="margin-bottom:12px"><h4>3 · Invert the beacon</h4>
<p>Delete the always-on tick and the on-axis lock tone. Beacon amplitude becomes
<b>proportional to heading error</b>, and <b>zero inside the dead-band</b>. Three continuous tones
become one, audible only when it means something.</p></div>
<div class="card"><h4>4 · Escalation ladder</h4>
<p>Per persistent error: <b>earcon at 0 s → one word at 4 s → full sentence at 10 s</b>. Someone
walking well hears almost nothing; someone genuinely lost gets progressively more help. Today both
get the same wall of sentences.</p></div>
</div>
<div>
<div class="card" style="margin-bottom:12px"><h4>5 · Obstacle novelty filter</h4>
<p>Key each obstacle on <i>(label, bearing bucket, distance bucket)</i>. Re-announce only if it is new
or has closed by ≥ 0.4 m. Today the same chair is announced every 4 seconds — almost certainly the
single largest source of the nagging.</p></div>
<div class="card" style="margin-bottom:12px"><h4>6 · Haptics carry urgency</h4>
<p>Light tap = circuit complete. Soft double = a correction is available. Sharp triple = obstacle.
This takes safety off the speech channel entirely, and it works when the Mataf is too loud for audio
— which it is.</p></div>
<div class="card" style="margin-bottom:12px"><h4>7 · Three verbosity levels + speech rate</h4>
<p><b>Minimal</b> (haptics and earcons only) · <b>Standard</b> (the ladder above) ·
<b>Learning</b> (today's behaviour, for a first-time user). Plus a speech-rate control defaulting
<b>above</b> Apple's default, which experienced screen-reader users find sluggish.</p></div>
<div class="card"><h4>8 · A hard budget</h4>
<p>Cap: <b>4 spoken events per 30 s</b>. Overflow degrades to earcons automatically. Even if the
thresholds are mistuned, the system cannot flood the user — the failure mode becomes quiet rather
than deafening.</p></div>
</div>
</div>`);

<script>
/* ============================================================
   Deck plumbing
   ============================================================ */
const deck=document.getElementById('deck'), dots=document.getElementById('dots');
let cur=0;
slides.forEach((html,i)=>{
  const d=document.createElement('section'); d.className='slide'; d.innerHTML=html; deck.appendChild(d);
  const t=document.createElement('div'); t.className='dot'; t.onclick=()=>show(i); dots.appendChild(t);
});
function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  [...deck.children].forEach((s,n)=>s.classList.toggle('on',n===cur));
  [...dots.children].forEach((s,n)=>s.classList.toggle('on',n===cur));
  document.getElementById('pos').textContent=(cur+1)+' / '+slides.length;
  deck.children[cur].scrollTop=0;
  stopAudio();
  renderPhones(); drawTimelines(); buildPhaseButtons();
}
function go(d){show(cur+d)}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}
  if(e.key==='Escape')stopAudio();
});

/* ---------- phone rendering + interaction ---------- */
function renderPhones(){
  for(const id in P){const el=document.getElementById(id); if(el) el.innerHTML=phoneHTML(P[id],id);}
}
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-act]'); if(!n)return;
  const id=n.dataset.id, act=n.dataset.act, s=P[id]; if(!s)return;
  const walking=()=>s.phase==='tawaf'||s.phase==='sai';
  switch(act){
    case 'lang':  s.lang={en:'ar',ar:'ur',ur:'en'}[s.lang]; break;
    case 'mute':  s.muted=!s.muted; break;
    case 'guide': s.guidanceOn=!s.guidanceOn; break;
    case 'dua':   s.dua=(s.dua+1)%3; break;
    case 'debug': s.debug=!s.debug; break;
    case 'pickTawaf': if(s.phase==='idle'){s.ritual='tawaf';s.phase='marking'} break;
    case 'pickSai':   if(s.phase==='idle'){s.ritual='sai';s.phase='marking'} break;
    case 'mark':
      if(s.phase==='marking'&&s.ritual==='tawaf'){s.phase='tawaf';s.count=0;s.progress=0}
      else if(s.phase==='marking'){s.phase='markingSecond'}
      else if(s.phase==='markingSecond'){s.phase='sai';s.count=0;s.progress=0}
      break;
    case 'voice':
      s.listening=!s.listening; renderPhones();
      if(s.listening) setTimeout(()=>{s.listening=false;s.speaking=true;renderPhones();
        setTimeout(()=>{s.speaking=false;renderPhones()},1400)},1600);
      return;
    case 'again': case 'reset':
      Object.assign(s,{phase:'idle',count:0,progress:0,guidanceState:'onPath',showChip:false});
      break;
  }
  renderPhones();
});

/* ---------- gentle walk simulation so the ring and states live ---------- */
let tick=0;
setInterval(()=>{
  tick++;
  let dirty=false;
  for(const id in P){const s=P[id];
    if(s.phase==='tawaf'||s.phase==='sai'){
      s.progress+=0.085;
      if(s.progress>=1){s.progress=0;s.count++;
        if(s.count>=7){ if(s.loop){s.count=0} else {s.count=7;s.phase='complete'} }}
      if(tick%5===0){
        const seq=['onPath','onPath','driftingOut','onPath','reversing','onPath','driftingIn','acquiring'];
        s.guidanceState=seq[(tick/5|0)%seq.length];
        s.showChip=(tick%20===0)||s.guidanceState==='driftingIn';
      }
      dirty=true;
    }
  }
  if(dirty && deck.children[cur].querySelector('.phone')) renderPhones();
},900);

/* ---------- phase jump buttons (slide 4) ---------- */
function buildPhaseButtons(){
  const host=deck.children[cur].querySelector('#phasebtns'); if(!host)return;
  const s=P['ph-phase'];
  const opts=[['idle','idle'],['marking','marking'],['markingSecond','markingSecond (Sa\'i)'],
              ['tawaf','tawaf'],['sai','sai'],['complete','complete']];
  host.innerHTML=opts.map(([k,lab])=>
    `<button class="sbtn ${s.phase===k?'on':''}" data-ph="${k}">${lab}</button>`).join('')
    +`<button class="sbtn ${s.guidanceOn?'on':''}" data-ph="_g">guidance ${s.guidanceOn?'on':'off'}</button>`;
  host.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ph;
    if(k==='_g'){s.guidanceOn=!s.guidanceOn}
    else{s.phase=k; s.ritual=(k==='sai'||k==='markingSecond')?'sai':'tawaf';
         if(k==='tawaf'||k==='sai'){s.count=2;s.progress=.35}
         if(k==='complete'){s.count=7;s.progress=0}
         if(k==='idle'){s.count=0;s.progress=0}}
    renderPhones(); buildPhaseButtons();
  });
}
function setVerb(btn,n){
  btn.parentNode.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const d=['Haptics and earcons only. No speech at all except ritual events and safety. Arguably the right default.',
    'Earcons and haptics, escalating to one word, then a full sentence only if the error persists past 10 seconds.',
    "Today's behaviour — full sentences every time. Appropriate for a first-time user learning what the cues mean, and for nobody else."][n];
  const el=document.getElementById('verbdesc'); if(el)el.textContent=d;
}

/* ============================================================
   Audio demo — real frequencies from GuidanceAudio.swift
   ============================================================ */
let ctx=null, nodes=[], timers=[], running=false;
function AC(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
function tone(freq,gain,pan){
  const c=AC(), o=c.createOscillator(), g=c.createGain(), p=c.createStereoPanner();
  o.frequency.value=freq; o.type='sine'; g.gain.value=gain; p.pan.value=pan||0;
  o.connect(g).connect(p).connect(c.destination); o.start();
  nodes.push({o,g,p}); return {o,g,p};
}
function say(text,rate){
  if(!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(text);
  u.rate=rate||1; u.lang='en-US'; speechSynthesis.speak(u);
}
function at(ms,fn){ timers.push(setTimeout(fn,ms)); }
function stopAudio(){
  timers.forEach(clearTimeout); timers=[];
  nodes.forEach(n=>{try{n.o.stop();n.o.disconnect()}catch(e){}}); nodes=[];
  if('speechSynthesis' in window) speechSynthesis.cancel();
  running=false;
  ['lognow','lognew'].forEach(i=>{const e=document.getElementById(i); if(e)e.textContent=''});
  document.querySelectorAll('#btn-now,#btn-new').forEach(b=>b.disabled=false);
}
function log(id,t){const e=document.getElementById(id); if(e)e.textContent=t;}

function playCurrent(){
  stopAudio(); running=true;
  document.getElementById('btn-now').disabled=true;
  const c=AC(); if(c.state==='suspended')c.resume();
  /* 1. beacon 440 Hz gated at 3.2/sec, panned */
  const b=tone(440,0,0.35);
  let k=0;
  const gate=setInterval(()=>{ if(!running)return clearInterval(gate);
    const t=c.currentTime; b.g.gain.cancelScheduledValues(t);
    b.g.gain.setValueAtTime(0.10,t); b.g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
    b.p.pan.value=0.45*Math.sin(k/4); k++;
  },1000/3.2);
  timers.push(gate);
  /* 2. on-axis lock tone 660 Hz, continuous */
  tone(660,0.035,0);
  /* 3. radial drift earcon 220 Hz, continuous */
  const d=tone(220,0.045,0);
  const dr=setInterval(()=>{ if(!running)return clearInterval(dr);
    d.o.frequency.value=220+30*Math.sin(Date.now()/1400); },90);
  timers.push(dr);
  /* speech at the real cooldowns — 11 sentences in 20 s */
  const G=["You're drifting too far out. Ease inward.",
           "You're drifting toward the Kaaba. Ease outward.",
           "Wrong way. Turn around and keep the Kaaba on your left.",
           "Good. You're back on the path.",
           "You're drifting too far out. Ease inward.",
           "Bear a little left.",
           "Circuit 3 of seven complete."];
  const O=["Careful, chair is close, 1.2 meters on your left.",
           "Careful, person is close, 1.1 meters on your right.",
           "Careful, chair is close, 0.9 meters on your left.",
           "Careful, table is close, 1.3 meters ahead."];
  G.forEach((t,i)=>at(i*3000,()=>{say(t);log('lognow','speech: '+t)}));
  O.forEach((t,i)=>at(4000+i*4200,()=>{say(t);log('lognow','warning: '+t)}));
  at(20500,()=>{stopAudio();log('lognow','— 20 s ended. That was 11 sentences over a constant tone bed.')});
}

function playProposed(){
  stopAudio(); running=true;
  document.getElementById('btn-new').disabled=true;
  const c=AC(); if(c.state==='suspended')c.resume();
  /* silence on path. earcon = two short notes, direction by pitch order + pan */
  function earcon(up,pan,label){
    const t=c.currentTime;
    [0,0.09].forEach((off,n)=>{
      const o=c.createOscillator(),g=c.createGain(),p=c.createStereoPanner();
      o.type='sine'; o.frequency.value= up ? (n?760:560) : (n?560:760);
      p.pan.value=pan; g.gain.value=0;
      o.connect(g).connect(p).connect(c.destination);
      g.gain.setValueAtTime(0.0001,t+off);
      g.gain.exponentialRampToValueAtTime(0.12,t+off+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.085);
      o.start(t+off); o.stop(t+off+0.1); nodes.push({o,g,p});
    });
    log('lognew','earcon: '+label);
  }
  function haptic(label){
    if(navigator.vibrate) navigator.vibrate(label==='obstacle'?[40,50,40,50,40]:[30]);
    log('lognew','haptic: '+label);
  }
  log('lognew','on path — silence');
  at(2200,()=>{earcon(false,-0.5,'drifting out · descending, left');haptic('correction')});
  at(4000,()=>log('lognew','on path — silence'));
  at(6500,()=>{earcon(false,-0.5,'still drifting')});
  at(6900,()=>{say('Inward.',1.15);log('lognew','one word: "Inward." — error persisted 4 s')});
  at(8600,()=>log('lognew','on path — silence'));
  at(11000,()=>{earcon(true,0.5,'reversing · urgent');haptic('obstacle')});
  at(11500,()=>{say('Turn around.',1.15);log('lognew','one word: "Turn around." — safety priority')});
  at(13500,()=>log('lognew','on path — silence'));
  at(15000,()=>{haptic('circuit');log('lognew','haptic tap: circuit complete')});
  at(15400,()=>{say('Three.',1.1);log('lognew','one word: "Three."')});
  at(17000,()=>log('lognew','on path — silence'));
  at(18500,()=>{earcon(false,-0.35,'gentle drift');haptic('correction')});
  at(20500,()=>{stopAudio();log('lognew','— 20 s ended. 3 words, 4 earcons, 4 haptics, and a lot of silence.')});
}

/* ---------- timelines ---------- */
function drawTimelines(){
  const now=deck.children[cur].querySelector('#tl-now');
  const nw=deck.children[cur].querySelector('#tl-new');
  if(!now||!nw)return;
  const T=20000, pc=ms=>(ms/T*100);
  now.querySelectorAll('.ev,.tone').forEach(e=>e.remove());
  nw.querySelectorAll('.ev,.tone').forEach(e=>e.remove());
  const bed=document.createElement('div'); bed.className='tone'; now.appendChild(bed);
  const G=[0,3000,6000,9000,12000,15000,18000], O=[4000,8200,12400,16600];
  [...G.map(t=>[t,2700]),...O.map(t=>[t,3400])].forEach(([t,d])=>{
    const e=document.createElement('div'); e.className='ev sp';
    e.style.left=pc(t)+'%'; e.style.width=Math.max(1.2,pc(d))+'%';
    now.appendChild(e);
  });
  [[2200,'ec'],[6500,'ec'],[11000,'ec'],[18500,'ec'],
   [2200,'hp'],[11000,'hp'],[15000,'hp'],[18500,'hp']]
   .forEach(([t,k])=>{const e=document.createElement('div');e.className='ev '+k;
    e.style.left=pc(t)+'%';e.style.width='1.1%';nw.appendChild(e);});
  [[6900,600],[11500,900],[15400,500]].forEach(([t,d])=>{
    const e=document.createElement('div'); e.className='ev sp';
    e.style.left=pc(t)+'%'; e.style.width=Math.max(1.2,pc(d))+'%'; nw.appendChild(e);});
}

show(0);
</script>

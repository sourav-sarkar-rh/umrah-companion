description = "Cloud scene-description proxy for AI Umrah Companion (keeps LLM keys off the phone)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
